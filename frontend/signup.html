<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>Sign Up — Prachi Beauty Shop</title>
</head>
<body>

<header class="header-part">
  <section class="top_text">
    <div class="head_container container">
      <div class="head_text"><p>Free shipping · 30-day returns · Products on rent</p></div>
      <div class="sign_in_up">
        <a href="login.html">SIGN IN</a>
        <a href="signup.html">SIGN UP</a>
      </div>
    </div>
  </section>
  <div class="container_logo">
    <div class="navbar-brand">
      <a href="index.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTe1R3Qo7BKO021XDz0IxJQV6WC5vmh_4PW2g&s" alt="Prachi Shop Logo" class="logo">
      </a>
    </div>
    <div class="navbar">
      <ul>
        <li class="nav-item"><a href="index.html"    class="nav-link">Home</a></li>
        <li class="nav-item"><a href="Category.html" class="nav-link">Category</a></li>
        <li class="nav-item"><a href="product.html"  class="nav-link">Product</a></li>
        <li class="nav-item"><a href="contact.html"  class="nav-link">Contact</a></li>
        <li class="nav-item">
          <a href="addTocard.html" class="nav-link add-to-card-button" id="cartvalue">
            <i class="fa-solid fa-cart-shopping"></i> 0
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>

<section class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join Prachi Beauty Shop and enjoy exclusive deals 🌸</p>

    <div class="auth-field">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" />
    </div>
    <div class="auth-field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" />
    </div>
    <div class="auth-field">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" />
    </div>

    <button class="auth-btn" id="signupBtn" onclick="handleSignup()">
      Create Account
    </button>
    <div class="auth-msg" id="signupMsg"></div>
    <div class="auth-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p style="text-align:center">© 2025 Prachi Beauty Parlour. All rights reserved.</p>
  </div>
</footer>

<script src="assets/js/api.js"></script>
<script>
  // If already logged in, redirect
  if (isLoggedIn()) window.location.href = 'index.html';

  async function handleSignup() {
    const name            = document.getElementById('name').value.trim();
    const email           = document.getElementById('email').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msg             = document.getElementById('signupMsg');
    const btn             = document.getElementById('signupBtn');

    // Client-side validation
    if (!name || !email || !password) {
      showMsg('Please fill in all fields', 'error'); return;
    }
    if (password.length < 6) {
      showMsg('Password must be at least 6 characters', 'error'); return;
    }
    if (password !== confirmPassword) {
      showMsg('Passwords do not match', 'error'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    const res = await api.post('/auth/signup', { name, email, password });

    if (res.ok) {
      saveAuth(res.data.token, res.data.user);
      showMsg(res.data.message, 'success');
      setTimeout(() => window.location.href = 'index.html', 1200);
    } else {
      showMsg(res.data.message || 'Something went wrong', 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  function showMsg(text, type) {
    const msg = document.getElementById('signupMsg');
    msg.textContent = text;
    msg.className = 'auth-msg ' + type;
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSignup();
  });
</script>
</body>
</html>
