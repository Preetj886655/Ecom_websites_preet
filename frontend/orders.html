<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>My Orders — Prachi Beauty Shop</title>
</head>
<body>

<header class="header-part">
  <section class="top_text">
    <div class="head_container container">
      <div class="head_text"><p>Free shipping · 30-day returns · Products on rent</p></div>
      <div class="sign_in_up">
        <a href="login.html">SIGN IN</a>
        <a href="signup.html">SIGN UP</a>
      </div>
    </div>
  </section>
  <div class="container_logo">
    <div class="navbar-brand">
      <a href="index.html">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTe1R3Qo7BKO021XDz0IxJQV6WC5vmh_4PW2g&s" alt="Logo" class="logo">
      </a>
    </div>
    <div class="navbar">
      <ul>
        <li class="nav-item"><a href="index.html"    class="nav-link">Home</a></li>
        <li class="nav-item"><a href="Category.html" class="nav-link">Category</a></li>
        <li class="nav-item"><a href="product.html"  class="nav-link">Product</a></li>
        <li class="nav-item"><a href="contact.html"  class="nav-link">Contact</a></li>
        <li class="nav-item">
          <a href="addTocard.html" class="nav-link add-to-card-button" id="cartvalue">
            <i class="fa-solid fa-cart-shopping"></i> 0
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>

<section class="orders-page">
  <div class="container">
    <h2 style="font-family:var(--font-head);font-size:34px;color:var(--deep-plum);margin-bottom:28px">
      My Orders
    </h2>

    <div id="loginPrompt" style="display:none;text-align:center;padding:60px 0">
      <i class="fa-solid fa-lock" style="font-size:40px;color:var(--text-muted);display:block;margin-bottom:16px"></i>
      <p style="color:var(--text-muted);margin-bottom:20px">Please login to view your orders</p>
      <a href="login.html" style="background:var(--deep-plum);color:#fff;padding:13px 32px;border-radius:30px;font-size:15px">
        Login
      </a>
    </div>

    <div id="ordersContainer"></div>
  </div>
</section>

<footer>
  <div class="container">
    <p style="text-align:center;color:rgba(255,255,255,0.55);font-size:13px">© 2025 Prachi Beauty Parlour. All rights reserved.</p>
  </div>
</footer>

<script src="assets/js/api.js"></script>
<script>
async function loadOrders() {
  if (!isLoggedIn()) {
    document.getElementById('loginPrompt').style.display = 'block';
    return;
  }

  const res = await api.get('/orders');
  const container = document.getElementById('ordersContainer');

  if (!res.ok) {
    container.innerHTML = '<p style="color:#C62828">Could not load orders.</p>';
    return;
  }

  const { orders } = res.data;

  if (!orders.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:60px 0">
        <i class="fa-solid fa-box-open" style="font-size:40px;color:var(--text-muted);display:block;margin-bottom:16px"></i>
        <p style="color:var(--text-muted);margin-bottom:20px">You have no orders yet</p>
        <a href="product.html" style="background:var(--deep-plum);color:#fff;padding:13px 32px;border-radius:30px;font-size:15px">
          Start Shopping
        </a>
      </div>`;
    return;
  }

  const statusMap = {
    placed:    { label: 'Order Placed',  cls: 'status-placed'    },
    confirmed: { label: 'Confirmed',     cls: 'status-confirmed' },
    shipped:   { label: 'Shipped',       cls: 'status-shipped'   },
    delivered: { label: 'Delivered',     cls: 'status-delivered' },
    cancelled: { label: 'Cancelled',     cls: 'status-cancelled' }
  };

  container.innerHTML = orders.map(order => {
    const st      = statusMap[order.orderStatus] || statusMap.placed;
    const date    = new Date(order.placedAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
    const itemsList = order.items.map(i =>
      `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <img src="${i.imageUrl || ''}" alt="${i.name}" style="width:56px;height:56px;object-fit:cover;border-radius:8px">
        <div>
          <p style="font-weight:500;font-size:14px">${i.name}</p>
          <p style="font-size:13px;color:var(--text-muted)">Qty: ${i.quantity} &nbsp;·&nbsp; ₹${i.price.toLocaleString('en-IN')}</p>
        </div>
      </div>`
    ).join('');

    return `
      <div class="order-card">
        <div class="order-header">
          <div>
            <p class="order-id">Order #${order._id.slice(-8).toUpperCase()}</p>
            <p style="font-size:13px;color:var(--text-muted);margin-top:2px">${date} · ${order.paymentMethod}</p>
          </div>
          <span class="order-status ${st.cls}">${st.label}</span>
        </div>
        ${itemsList}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
          <p style="font-size:13px;color:var(--text-muted)">
            ${order.shippingAddress.city}, ${order.shippingAddress.state}
          </p>
          <p style="font-weight:600;font-size:17px;color:var(--deep-plum)">
            Total: ₹${order.totalAmount.toLocaleString('en-IN')}
          </p>
        </div>
      </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
